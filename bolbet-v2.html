<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOLBET — bet on the chaos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..900&family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<!--
  BOLBET v2 — Part 2 of the Front End Engineering-II project.
  Part 1 was plain JavaScript. Part 2 rebuilds the same app in React and adds:
    - Redux Toolkit (createSlice, createAsyncThunk, extraReducers, middleware)
    - Context API (auth, toasts, sound, the "new bet" composer)
    - Hooks: useState, useEffect, useRef, useMemo, useCallback, useReducer,
      useContext, useSyncExternalStore + 12 custom hooks (useDebounce, useForm ...)
    - Routing (hash router), forms with validation, reusable inputs
    - Modal, tabs, dropdowns, toast notifications, search/filter/sort
    - REST APIs with axios: loading, retry, error handling, pagination,
      infinite scroll, debounce, CRUD, third-party APIs (TVMaze, GitHub, DummyJSON)
  Everything still lives in this one HTML file. Libraries load from a CDN and
  Babel turns the JSX into JavaScript inside the browser.
-->

<style>
/* =========================================================
   1. THEME COLOURS
   ========================================================= */
:root{
  --bg:#0d0b14; --bg-alt:#141026; --surface:#1b1730; --surface-2:#242040;
  --lime:#c6ff3d; --pink:#ff3ea0; --cyan:#3ed9ff; --purple:#9b6bff; --orange:#ffa53e;
  --text:#f6f3ff; --text-dim:#a79fc4; --border:rgba(255,255,255,.09);
}

/* =========================================================
   2. BASE
   ========================================================= */
*{ box-sizing:border-box; margin:0; padding:0; }
body{
  background:
    radial-gradient(circle at 12% -10%, rgba(155,107,255,.35), transparent 40%),
    radial-gradient(circle at 90% 0%, rgba(255,62,160,.25), transparent 45%),
    var(--bg);
  color:var(--text); font-family:'Inter', sans-serif; min-height:100vh; overflow-x:hidden;
}
h1,h2,h3,h4{ font-family:'Bricolage Grotesque', sans-serif; }
a{ color:inherit; text-decoration:none; }
button{ font-family:inherit; cursor:pointer; border:none; }
.wrap{ max-width:1180px; margin:0 auto; padding:0 24px; }
main{ min-height:60vh; }
.boot{ min-height:100vh; display:grid; place-items:center; color:var(--text-dim); font-family:'Space Mono',monospace; }
.ic{ display:inline-flex; width:var(--s); height:var(--s); flex-shrink:0; vertical-align:middle; }
.ic svg{ width:100%; height:100%; }

/* =========================================================
   3. NAVBAR
   ========================================================= */
nav.top{ position:sticky; top:0; z-index:50; background:rgba(13,11,20,.88);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--border); }
.nav-inner{ max-width:1180px; margin:0 auto; padding:14px 24px;
  display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; }
.logo{ font-size:26px; font-weight:800; font-family:'Bricolage Grotesque'; }
.logo span{ color:var(--bg); background:var(--lime); padding:2px 8px; border-radius:8px; display:inline-block; }
.nav-links{ display:flex; gap:4px; flex-wrap:wrap; align-items:center; }
.nav-links > a, .nav-more{ background:none; color:var(--text-dim); font-weight:600; font-size:14px;
  padding:8px 12px; border-radius:999px; display:inline-flex; align-items:center; gap:6px; }
.nav-links > a:hover, .nav-more:hover{ color:var(--text); background:var(--surface); }
.nav-links > a.active, .nav-more.active{ background:var(--lime); color:var(--bg); font-weight:800; }
.nav-right{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.clout-pill{ background:var(--surface); border:1px solid var(--border);
  padding:8px 14px; border-radius:999px; font-size:14px; font-weight:700; }
.clout-pill b{ color:var(--lime); }
.btn{ background:var(--lime); color:var(--bg); font-weight:800; font-size:14px;
  padding:10px 18px; border-radius:999px; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
.btn:hover{ opacity:.88; }
.btn:disabled, .btn-outline:disabled{ opacity:.5; cursor:not-allowed; }
.btn-outline{ background:none; border:1.5px solid var(--border); color:var(--text);
  padding:10px 18px; border-radius:999px; font-weight:700; font-size:14px;
  display:inline-flex; align-items:center; justify-content:center; gap:8px; }
.btn-outline:hover{ border-color:var(--lime); color:var(--lime); }
.btn-sm{ padding:7px 13px; font-size:12.5px; }
.user-chip{ display:inline-flex; align-items:center; gap:8px; background:var(--surface);
  border:1px solid var(--border); padding:4px 12px 4px 4px; border-radius:999px; font-weight:700; font-size:13.5px; }
.user-chip img{ width:30px; height:30px; border-radius:50%; }

/* =========================================================
   4. HERO
   ========================================================= */
.hero{ padding:90px 24px 50px; text-align:center; position:relative; overflow:hidden; }
.hero > *{ position:relative; z-index:1; }
.blob{ position:absolute; border-radius:50%; filter:blur(70px); opacity:.35; z-index:0; }
.blob1{ width:340px; height:340px; background:var(--purple); top:-100px; left:-70px; }
.blob2{ width:300px; height:300px; background:var(--pink); bottom:-90px; right:-60px; }
.hero-tag{ display:inline-block; font-family:'Space Mono',monospace; font-size:12.5px;
  text-transform:uppercase; letter-spacing:1.5px; background:var(--surface);
  border:1px solid var(--border); padding:7px 16px; border-radius:999px; color:var(--cyan); margin-bottom:28px; }
.hero h1{ font-size:clamp(44px, 9vw, 100px); line-height:.95; font-weight:800; letter-spacing:-2px; }
.hero h1 .line{ display:block; }
.hero h1 .pink{ background:var(--pink); color:var(--bg); padding:0 12px; border-radius:10px; }
.hero h1 .lime{ background:var(--lime); color:var(--bg); padding:0 12px; border-radius:10px; }
.hero p{ max-width:600px; margin:26px auto 0; color:var(--text-dim); font-size:17px; }
.hero-buttons{ margin-top:32px; display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
.stickers{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:32px; }
.sticker{ font-family:'Space Mono',monospace; font-size:12px; font-weight:700;
  padding:8px 15px; border-radius:999px; border:1px solid var(--border); background:var(--surface); }
.avatars{ display:flex; justify-content:center; align-items:center; gap:10px; margin-top:32px; flex-wrap:wrap; }
.avatars img{ width:38px; height:38px; border-radius:50%; border:2px solid var(--bg); margin-left:-11px; }
.avatars img:first-child{ margin-left:0; }
.avatars span{ font-size:13.5px; color:var(--text-dim); font-weight:600; }
.stats{ display:flex; justify-content:center; gap:50px; margin-top:60px; flex-wrap:wrap; }
.stat b{ display:block; font-size:34px; font-weight:800; font-family:'Bricolage Grotesque'; }
.stat span{ font-size:12.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px; }

/* =========================================================
   5. TICKER
   ========================================================= */
.ticker{ margin-top:56px; background:var(--surface); overflow:hidden; padding:12px 0;
  border-top:1px solid var(--border); border-bottom:1px solid var(--border); }
.ticker-track{ display:flex; gap:40px; white-space:nowrap; width:max-content; animation:slide 30s linear infinite; }
.ticker-track span{ font-family:'Space Mono',monospace; font-size:13px; color:var(--text-dim); }
.ticker-track b{ color:var(--lime); }
@keyframes slide{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }
@media (prefers-reduced-motion: reduce){ .ticker-track{ animation:none; } }

/* =========================================================
   6. SECTIONS + CARDS
   ========================================================= */
.section{ padding:70px 24px 0; }
.section-head{ display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; }
.section h2{ font-size:34px; letter-spacing:-1px; }
.section .subtitle{ color:var(--text-dim); font-size:14.5px; margin-top:4px; margin-bottom:26px; }
.grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(290px, 1fr)); gap:18px; }
.card{ background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:22px; }
.card h4{ font-size:16.5px; margin-bottom:7px; }
.card p{ font-size:13.5px; color:var(--text-dim); line-height:1.55; }
.card > .ic{ margin-bottom:12px; }
.tile{ background:var(--surface); border:1px solid var(--border); border-radius:18px;
  padding:22px; text-align:center; display:block; }
.tile:hover{ border-color:var(--lime); }
.tile .name{ font-weight:700; font-size:14.5px; margin-top:8px; }
.tile .count{ font-size:12px; color:var(--text-dim); margin-top:4px; }
.list-box{ background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:10px; }
.row{ display:flex; align-items:center; gap:14px; padding:13px 15px; border-radius:14px; border:1px solid transparent; }
.row:hover{ background:var(--surface-2); }
.row .text{ font-size:13.5px; color:var(--text-dim); }
.row .text b{ color:var(--lime); }
.row.me{ background:rgba(198,255,61,.08); border-color:rgba(198,255,61,.3); }
.quote img{ width:38px; height:38px; border-radius:50%; }
.quote .top{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
.quote .who{ font-weight:700; font-size:14px; }
.quote .role{ font-size:11.5px; color:var(--text-dim); }
.quote p{ font-style:italic; font-size:14.5px; line-height:1.6; }
.faq{ background:var(--surface); border:1px solid var(--border); border-radius:16px; margin-bottom:12px; }
.faq button.q{ width:100%; background:none; color:var(--text); display:flex; justify-content:space-between;
  font-weight:700; font-size:15px; gap:12px; padding:18px 20px; text-align:left; }
.faq .sign{ color:var(--lime); }
.faq .a{ color:var(--text-dim); font-size:13.5px; line-height:1.65; padding:0 20px 18px; }
.banner{ background:linear-gradient(120deg, var(--purple), var(--pink));
  border-radius:26px; padding:54px 30px; text-align:center; margin-top:30px; }
.banner h2{ color:#fff; margin-bottom:16px; }
.banner p{ color:rgba(255,255,255,.85); max-width:420px; margin:0 auto 22px; font-size:15px; }
.banner .btn{ background:var(--bg); color:var(--lime); }

/* =========================================================
   7. BET CARDS
   ========================================================= */
.bet{ background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:22px; }
.bet:hover{ border-color:rgba(255,255,255,.2); }
.bet-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:8px; }
.category{ font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.8px;
  padding:5px 10px; border-radius:999px; background:var(--surface-2); color:var(--cyan); }
.timer{ font-family:'Space Mono',monospace; font-size:12px; color:var(--text-dim); }
.timer.soon{ color:var(--pink); font-weight:700; }
.bet > .ic{ margin-bottom:12px; }
.bet .question{ font-size:18px; font-weight:700; line-height:1.3; margin-bottom:16px; min-height:46px; }
.option{ position:relative; width:100%; text-align:left; overflow:hidden;
  background:var(--surface-2); border:1px solid var(--border); border-radius:14px;
  padding:12px 14px; margin-bottom:8px; color:var(--text); font-weight:700; font-size:14.5px; }
.option:hover:not(:disabled){ border-color:var(--lime); }
.option:disabled{ cursor:default; }
.option.picked{ border-color:var(--cyan); }
.option.won{ border-color:var(--lime); }
.bar{ position:absolute; left:0; top:0; bottom:0; width:0; background:rgba(198,255,61,.25); transition:width .5s ease; }
.option.b .bar{ background:rgba(255,62,160,.25); }
.option .inner{ position:relative; display:flex; justify-content:space-between; gap:10px; }
.percent{ font-family:'Space Mono',monospace; font-size:13px; color:var(--text-dim); }
.bet-foot{ display:flex; justify-content:space-between; align-items:center;
  font-size:12.5px; color:var(--text-dim); margin-top:10px; gap:8px; }
.result{ font-weight:800; }
.result.win{ color:var(--lime); }
.result.loss{ color:var(--pink); }
.reactions{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
.react{ display:inline-flex; align-items:center; gap:5px; background:var(--surface-2); border:1px solid var(--border);
  border-radius:999px; padding:6px 11px; font-size:12.5px; font-weight:700; color:var(--text-dim); }
.react:hover{ border-color:var(--lime); color:var(--text); }
.react.danger:hover{ border-color:var(--pink); color:var(--pink); }
.push-right{ margin-left:auto; }

/* =========================================================
   8. FILTERS, CHIPS, DROPDOWN, PAGINATION
   ========================================================= */
.filters{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:18px; align-items:center; }
.search-wrap{ position:relative; flex:1; min-width:220px; }
.search-wrap > .ic{ position:absolute; left:15px; top:50%; transform:translateY(-50%); color:var(--text-dim); }
.search-wrap input{ width:100%; background:var(--surface); border:1px solid var(--border); color:var(--text);
  padding:11px 16px 11px 42px; border-radius:999px; font-family:inherit; font-size:14px; font-weight:600; outline:none; }
.search-wrap input:focus{ border-color:var(--cyan); }
.typing{ position:absolute; right:16px; top:50%; transform:translateY(-50%); font-size:11.5px;
  color:var(--text-dim); font-family:'Space Mono',monospace; }
.chips{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:24px; }
.chip{ background:var(--surface); border:1px solid var(--border); color:var(--text-dim);
  padding:9px 16px; border-radius:999px; font-weight:700; font-size:13.5px; display:inline-flex; gap:8px; align-items:center; }
.chip:hover{ color:var(--text); }
.chip.active{ background:var(--purple); border-color:var(--purple); color:#fff; }
.count-badge{ background:rgba(0,0,0,.25); border-radius:999px; padding:1px 8px; font-size:11.5px; }
.dropdown{ position:relative; display:inline-block; }
.dropdown-btn{ display:inline-flex; align-items:center; gap:8px; background:var(--surface);
  border:1px solid var(--border); color:var(--text); padding:10px 16px; border-radius:999px; font-weight:600; font-size:14px; }
.dropdown-btn:hover{ border-color:var(--cyan); }
.dropdown-btn small{ color:var(--text-dim); font-weight:600; }
.dropdown-menu{ position:absolute; top:calc(100% + 8px); min-width:200px; background:var(--bg-alt);
  border:1px solid var(--border); border-radius:14px; padding:6px; z-index:60;
  box-shadow:0 18px 40px rgba(0,0,0,.45); animation:pop .15s ease; }
.dropdown-menu.left{ left:0; } .dropdown-menu.right{ right:0; }
.dropdown-item{ display:flex; width:100%; text-align:left; align-items:center; justify-content:space-between;
  gap:10px; background:none; color:var(--text-dim); padding:10px 12px; border-radius:10px; font-weight:600; font-size:14px; }
.dropdown-item:hover, .dropdown-item:focus{ background:var(--surface); color:var(--text); outline:none; }
.dropdown-item.selected{ color:var(--lime); }
.pagination{ display:flex; gap:6px; justify-content:center; align-items:center; margin-top:28px; flex-wrap:wrap; }
.page-btn{ min-width:38px; height:38px; padding:0 10px; border-radius:12px; background:var(--surface);
  border:1px solid var(--border); color:var(--text-dim); font-weight:700; }
.page-btn:hover:not(:disabled){ color:var(--text); border-color:var(--lime); }
.page-btn.active{ background:var(--lime); color:var(--bg); border-color:var(--lime); }
.page-btn:disabled{ opacity:.4; cursor:not-allowed; }
.dots{ color:var(--text-dim); padding:0 4px; }
.result-meta{ font-size:12.5px; color:var(--text-dim); margin:-6px 0 18px; font-family:'Space Mono',monospace; }

/* =========================================================
   9. LOADING / ERROR / EMPTY STATES
   ========================================================= */
.spinner{ width:18px; height:18px; border:2.5px solid currentColor; border-right-color:transparent;
  border-radius:50%; display:inline-block; animation:spin .7s linear infinite; vertical-align:middle; }
@keyframes spin{ to{ transform:rotate(360deg); } }
.skeleton{ background:linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%);
  background-size:200% 100%; animation:shimmer 1.2s infinite; border-radius:20px; min-height:200px; border:1px solid var(--border); }
@keyframes shimmer{ to{ background-position:-200% 0; } }
.state-box{ grid-column:1/-1; text-align:center; padding:44px 20px; background:var(--surface);
  border:1px dashed var(--border); border-radius:20px; color:var(--text-dim); font-size:14px; }
.state-box.error{ border-color:rgba(255,62,160,.55); }
.state-box h4{ color:var(--text); font-size:18px; margin-bottom:6px; }
.state-box .btn, .state-box .btn-outline{ margin-top:16px; }
.load-row{ display:flex; justify-content:center; align-items:center; gap:10px; padding:28px; color:var(--text-dim); font-size:14px; }
.sentinel{ height:2px; }
.credit{ font-size:12px; color:var(--text-dim); margin-top:24px; text-align:center; }
.credit a{ text-decoration:underline; }

/* =========================================================
   10. FORMS (reusable inputs)
   ========================================================= */
.field{ margin-bottom:16px; }
.field > label, .field > .label{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.5px;
  color:var(--text-dim); display:block; margin-bottom:7px; }
.req{ color:var(--pink); margin-left:3px; }
.input{ width:100%; background:var(--surface); border:1.5px solid var(--border); color:var(--text);
  padding:11px 14px; border-radius:12px; font-family:inherit; font-size:14px; font-weight:600; outline:none; transition:border-color .15s; }
.modal .input{ background:var(--surface); }
.input:focus{ border-color:var(--cyan); }
.field.has-error .input{ border-color:var(--pink); }
textarea.input{ resize:vertical; min-height:96px; line-height:1.5; }
select.input{ appearance:none; background-image:linear-gradient(45deg, transparent 50%, var(--text-dim) 50%), linear-gradient(135deg, var(--text-dim) 50%, transparent 50%);
  background-position:calc(100% - 20px) 50%, calc(100% - 14px) 50%; background-size:6px 6px; background-repeat:no-repeat; padding-right:36px; }
.field-error{ color:var(--pink); font-size:12.5px; margin-top:6px; font-weight:600; }
.field-hint{ color:var(--text-dim); font-size:12px; margin-top:6px; }
.field-hint.ok{ color:var(--lime); font-weight:600; }
.input-row{ position:relative; }
.input-row .peek{ position:absolute; right:8px; top:50%; transform:translateY(-50%); background:var(--surface-2);
  color:var(--text-dim); font-size:12px; font-weight:700; padding:6px 10px; border-radius:8px; }
.field > label.check{ display:flex; align-items:flex-start; gap:10px; font-size:14px; color:var(--text);
  cursor:pointer; font-weight:600; text-transform:none; letter-spacing:0; margin:0; }
.check input{ accent-color:var(--lime); width:18px; height:18px; margin-top:1px; flex-shrink:0; }
.pill-group{ display:flex; flex-wrap:wrap; gap:8px; }
.pill-check{ display:inline-flex; align-items:center; gap:6px; background:var(--surface); border:1.5px solid var(--border);
  color:var(--text-dim); padding:8px 14px; border-radius:999px; font-size:13px; font-weight:700; cursor:pointer; }
.pill-check input{ position:absolute; opacity:0; pointer-events:none; }
.pill-check.on{ background:var(--purple); border-color:var(--purple); color:#fff; }
.pill-check:focus-within{ outline:2px solid var(--cyan); outline-offset:2px; }
.strength{ display:flex; gap:6px; margin-top:8px; }
.strength span{ flex:1; height:5px; border-radius:999px; background:var(--surface-2); }
.avatar-pick{ display:flex; gap:10px; flex-wrap:wrap; }
.avatar-pick button{ padding:0; background:none; border:2.5px solid var(--border); border-radius:50%; }
.avatar-pick button.on{ border-color:var(--lime); }
.avatar-pick img{ width:52px; height:52px; border-radius:50%; display:block; }
.form-card{ background:var(--surface); border:1px solid var(--border); border-radius:22px; padding:26px; }
.form-card .input{ background:var(--bg-alt); }
.form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:0 18px; }
.span-2{ grid-column:1/-1; }
.server-error{ background:rgba(255,62,160,.12); border:1px solid rgba(255,62,160,.4); color:var(--pink);
  border-radius:12px; padding:12px 14px; font-size:13.5px; font-weight:600; margin-bottom:16px; }
.two-col{ display:grid; grid-template-columns:340px 1fr; gap:24px; align-items:start; }
.sticky{ position:sticky; top:96px; }
@media(max-width:900px){ .two-col{ grid-template-columns:1fr; } .sticky{ position:static; } }
@media(max-width:640px){ .form-grid{ grid-template-columns:1fr; } }

/* =========================================================
   11. LEADERBOARD + PROFILE
   ========================================================= */
.rank{ font-weight:800; font-size:17px; width:30px; color:var(--text-dim); }
.rank.top{ color:var(--lime); }
.row img{ width:42px; height:42px; border-radius:50%; border:2px solid var(--border); }
.row .name{ font-weight:700; }
.row .role{ font-size:12px; color:var(--text-dim); }
.row .grow{ flex:1; }
.row .score{ font-family:'Space Mono',monospace; font-weight:700; color:var(--lime); }
.profile{ display:flex; align-items:center; gap:20px; background:var(--surface);
  border:1px solid var(--border); border-radius:20px; padding:26px; margin-bottom:28px; flex-wrap:wrap; }
.profile > img{ width:80px; height:80px; border-radius:50%; border:3px solid var(--lime); }
.profile .who h3{ font-size:24px; }
.profile .who p{ color:var(--text-dim); font-size:14px; }
.profile .numbers{ display:flex; gap:28px; margin-left:auto; flex-wrap:wrap; }
.profile .numbers b{ display:block; font-size:22px; font-family:'Bricolage Grotesque'; }
.profile .numbers span{ font-size:11.5px; color:var(--text-dim); text-transform:uppercase; }
.badges{ display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:14px; }

  if (ms <= 0) return "closing...";
  const totalMinutes = Math.floor(ms / 60000);
  const hours = Math.floor(totalMinutes / 60);
  if (hours >= 24) return Math.floor(hours / 24) + "d " + (hours % 24) + "h left";
  if (hours > 0) return hours + "h " + (totalMinutes % 60) + "m left";
  if (totalMinutes > 0) return totalMinutes + "m left";
  return Math.ceil(ms / 1000) + "s left";
}

function timeAgo(timestamp) {
  const minutes = Math.floor((Date.now() - timestamp) / 60000);
  if (minutes < 1) return "just now";
  if (minutes < 60) return minutes + "m ago";
  const hours = Math.floor(minutes / 60);
  return hours < 24 ? hours + "h ago" : Math.floor(hours / 24) + "d ago";
}

// Only retry problems that might fix themselves: no network, server errors, rate limits.
function isRetryable(err) {
  if (axios.isCancel(err)) return false;
  const status = err.response && err.response.status;
  return !status || status >= 500 || status === 429;
}

// Try a request, and if it fails for a retryable reason wait and try again
// (500ms, then 1000ms). This is called exponential backoff.
async function withRetry(request, retries = 2, delay = 500) {
  try {
    return await request();
  } catch (err) {
    if (retries <= 0 || !isRetryable(err)) throw err;
    await sleep(delay);
    return withRetry(request, retries - 1, delay * 2);
  }
}

// Turn an axios error into a sentence a person can read.
function errorMessage(err, custom = {}) {
  if (!err) return "Something went wrong.";
  const status = err.response && err.response.status;
  if (status && custom[status]) return custom[status];
  if (status === 404) return "We couldn't find that.";
  if (status === 403 || status === 429) return "Too many requests. Give it a minute, then retry.";
  if (status >= 500) return "The server is having a moment. Try again.";
  if (err.code === "ECONNABORTED") return "That took too long. Check your connection.";
  if (!status) return "Network error. Are you online?";
  return err.message || "Something went wrong.";
}

async function fetchGithub(login) {
  // Two requests at the same time; Promise.all waits for both.
  const [profile, repos] = await Promise.all([
    withRetry(() => api.get(ENDPOINTS.github + "/users/" + login)),
    withRetry(() => api.get(ENDPOINTS.github + "/users/" + login + "/repos", { params: { sort: "updated", per_page: 6 } }))
  ]);
  return { profile: profile.data, repos: repos.data };
}

function makeSeedBets() {
  const now = Date.now();
  return SEED_BETS.map(bet => ({
    ...bet,
    myVote: null, closed: false, winner: null, payout: 0,
    reactions: { doubt: 0, hype: 0, shook: 0 },
    createdAt: now - bet.id * 60000,
    closesAt: now + bet.minutes * 60000
  }));
}

/* ---- bets slice ---- */
const betsSlice = createSlice({
  name: "bets",
  initialState: { items: makeSeedBets() },
  reducers: {
    // createSlice uses Immer, so "mutating" code here is turned into an immutable update.
    voted(state, action) {
      const { id, side } = action.payload;
      const bet = state.items.find(b => b.id === id);
      if (!bet || bet.myVote || bet.closed) return;
      bet.myVote = side;
      if (side === "A") bet.votesA++; else bet.votesB++;
    },
    reacted(state, action) {
      const bet = state.items.find(b => b.id === action.payload.id);
      if (bet) bet.reactions[action.payload.key]++;
    },
    betAdded: {
      reducer(state, action) { state.items.push(action.payload); },
      // prepare() builds the payload. Random ids and Date.now() belong here,
      // not in the reducer, because reducers must be pure.
      prepare({ question, optionA, optionB, category, hours }) {
        const now = Date.now();
        return { payload: {
          id: nanoid(), question, optionA, optionB, category,
          votesA: 0, votesB: 0, myVote: null, closed: false, winner: null, payout: 0,
          reactions: { doubt: 0, hype: 0, shook: 0 },
          createdAt: now, closesAt: now + hours * 3600000, mine: true
        } };
      }
    },
    betDeleted(state, action) {
      state.items = state.items.filter(b => b.id !== action.payload);
    },
    betResolved: {
      reducer(state, action) {
        const { id, upset, winAmount, lossAmount } = action.payload;
        const bet = state.items.find(b => b.id === id);
        if (!bet || bet.closed) return;
        bet.closed = true;
        // The popular side usually wins, but 30% of the time it's an upset.
        const popular = bet.votesA >= bet.votesB ? "A" : "B";
        bet.winner = upset ? (popular === "A" ? "B" : "A") : popular;
        if (bet.myVote) bet.payout = bet.myVote === bet.winner ? winAmount : -lossAmount;
      },
      prepare(id) {
        return { payload: {
          id, upset: Math.random() < 0.3,
          winAmount: 20 + Math.floor(Math.random() * 40),
          lossAmount: 10 + Math.floor(Math.random() * 15)
        } };
      }
    }
  }
});
const { voted, reacted, betAdded, betDeleted, betResolved } = betsSlice.actions;

/* ---- wallet slice ---- */
const walletSlice = createSlice({
  name: "wallet",
  initialState: { clout: 1240 },
  reducers: {
    cloutChanged(state, action) { state.clout += action.payload; }
  },
  // extraReducers lets this slice react to actions owned by ANOTHER slice.
  extraReducers: builder => {
    builder.addCase(voted, state => { state.clout += 10; });
  }
});
const { cloutChanged } = walletSlice.actions;

/* ---- feed slice ---- */
const feedSlice = createSlice({
  name: "feed",
  initialState: { items: INITIAL_FEED.map((f, i) => ({ id: "seed-" + i, ...f })) },
  reducers: {
    feedAdded: {
      reducer(state, action) {
        state.items.unshift(action.payload);
        if (state.items.length > 12) state.items.pop();
      },
      prepare(text, highlight) { return { payload: { id: nanoid(), text, highlight } }; }
    }
  },
  extraReducers: builder => {
    builder.addCase(betAdded, (state, action) => {
      state.items.unshift({ id: "bet-" + action.payload.id, text: 'New bet dropped: "' + shorten(action.payload.question) + '"' });
      if (state.items.length > 12) state.items.pop();
    });
  }
});
const { feedAdded } = feedSlice.actions;

/* ---- wall slice: CRUD against a REST API with createAsyncThunk ---- */
const WALL_PAGE_SIZE = 6;

function normalisePost(p) {
  return {
    id: p.id, title: p.title, body: p.body, tags: p.tags || [], userId: p.userId,
    likes: typeof p.reactions === "object" && p.reactions ? p.reactions.likes : (p.reactions || 0),
    liked: false, local: false
  };
}

// READ (with pagination + search). "condition" skips the request if we already have that page.
const fetchWall = createAsyncThunk(
  "wall/fetch",
  async ({ page = 1, query = "" }, { rejectWithValue }) => {
    try {
      const url = query ? ENDPOINTS.posts + "/search" : ENDPOINTS.posts;
      const params = { limit: WALL_PAGE_SIZE, skip: (page - 1) * WALL_PAGE_SIZE };
      if (query) params.q = query;
      const res = await withRetry(() => api.get(url, { params }));
      return { posts: res.data.posts.map(normalisePost), total: res.data.total };
    } catch (err) {
      return rejectWithValue(errorMessage(err));
    }
  },
  {
    condition({ page = 1, query = "", force }, { getState }) {
      const wall = getState().wall;
      const same = wall.page === page && wall.query === query;
      if (!force && same && (wall.status === "loading" || wall.status === "succeeded")) return false;
    }
  }
);

// CREATE. DummyJSON pretends to save the post and returns an id, but never really
// stores it, so we keep our own copy (with a local id) in Redux + localStorage.
const createPost = createAsyncThunk("wall/create", async ({ title, body, author }, { rejectWithValue }) => {
  try {
    const res = await api.post(ENDPOINTS.posts + "/add", { title, body, userId: 1 });
    return {
      id: "local-" + res.data.id + "-" + nanoid(5), title: res.data.title, body: res.data.body,
      tags: ["campus"], likes: 0, liked: false, local: true, author, createdAt: Date.now()
    };
  } catch (err) {
    return rejectWithValue(errorMessage(err));
  }
});

// UPDATE. Server posts get a real PUT; our own local posts skip the network.
const updatePost = createAsyncThunk("wall/update", async ({ post, changes }, { rejectWithValue }) => {
  try {
    if (post.local) await sleep(300);
    else await api.put(ENDPOINTS.posts + "/" + post.id, changes);
    return { id: post.id, changes };
  } catch (err) {
    return rejectWithValue(errorMessage(err));
  }
});

// DELETE
const deletePost = createAsyncThunk("wall/delete", async (post, { rejectWithValue }) => {
  try {
    if (post.local) await sleep(300);
    else await api.delete(ENDPOINTS.posts + "/" + post.id);
    return post.id;
  } catch (err) {
    return rejectWithValue(errorMessage(err));
  }
});

const wallInitial = {
  items: [], mine: [], total: 0, page: 1, query: "",
  status: "idle", error: null, lastRequestId: null, busyIds: [], creating: false
};

function findPost(state, id) {
  return state.items.find(p => p.id === id) || state.mine.find(p => p.id === id);
}
function clearBusy(state, id) {
  state.busyIds = state.busyIds.filter(x => x !== id);
}

const wallSlice = createSlice({
  name: "wall",
  initialState: wallInitial,
  reducers: {
    postLiked(state, action) {
      const post = findPost(state, action.payload);
      if (post) { post.liked = !post.liked; post.likes += post.liked ? 1 : -1; }
    }
  },
  extraReducers: builder => {
    builder
      // Each async thunk dispatches pending -> fulfilled OR rejected.
      .addCase(fetchWall.pending, (state, action) => {
        state.status = "loading";
        state.error = null;
        state.page = action.meta.arg.page || 1;
        state.query = action.meta.arg.query || "";
        state.lastRequestId = action.meta.requestId;
      })
      .addCase(fetchWall.fulfilled, (state, action) => {
        // Ignore answers to old requests (e.g. user typed again while this was loading).
        if (action.meta.requestId !== state.lastRequestId) return;
        state.status = "succeeded";
        state.items = action.payload.posts;
        state.total = action.payload.total;
      })
      .addCase(fetchWall.rejected, (state, action) => {
        if (action.meta.requestId !== state.lastRequestId) return;
        state.status = "failed";
        state.error = action.payload || action.error.message;
      })
      .addCase(createPost.pending,   state => { state.creating = true; })
      .addCase(createPost.fulfilled, (state, action) => { state.creating = false; state.mine.unshift(action.payload); })
      .addCase(createPost.rejected,  state => { state.creating = false; })
      .addCase(updatePost.pending,   (state, action) => { state.busyIds.push(action.meta.arg.post.id); })
      .addCase(updatePost.fulfilled, (state, action) => {
        clearBusy(state, action.payload.id);
        const post = findPost(state, action.payload.id);
        if (post) Object.assign(post, action.payload.changes, { edited: true });
      })
      .addCase(updatePost.rejected,  (state, action) => { clearBusy(state, action.meta.arg.post.id); })
      .addCase(deletePost.pending,   (state, action) => { state.busyIds.push(action.meta.arg.id); })
      .addCase(deletePost.fulfilled, (state, action) => {
        clearBusy(state, action.payload);
        state.items = state.items.filter(p => p.id !== action.payload);
        state.mine = state.mine.filter(p => p.id !== action.payload);
      })
      .addCase(deletePost.rejected,  (state, action) => { clearBusy(state, action.meta.arg.id); });
  }
});
const { postLiked } = wallSlice.actions;

/* ---- thunks: logic that reads state and dispatches several actions ---- */
function placeVote(id, side) {
  return (dispatch, getState) => {
    const bet = getState().bets.items.find(b => b.id === id);
    if (!bet || bet.myVote || bet.closed) return false;   // you can only vote once
    dispatch(voted({ id, side }));                         // walletSlice adds +10 itself
    dispatch(feedAdded('You backed "' + shorten(bet.question) + '"', "+10 clout"));
    return true;
  };
}

function resolveExpiredBets() {
  return (dispatch, getState) => {
    const now = Date.now();
    const payouts = [];
    getState().bets.items
      .filter(bet => !bet.closed && bet.closesAt <= now)
      .forEach(bet => {
        dispatch(betResolved(bet.id));
        const after = getState().bets.items.find(b => b.id === bet.id);
        if (after.myVote) {
          dispatch(cloutChanged(after.payout));
          dispatch(after.payout > 0
            ? feedAdded("A bet resolved, you won", "+" + after.payout + " clout")
            : feedAdded("A bet resolved, not everyone called it right"));
          payouts.push(after.payout);
        } else {
          dispatch(feedAdded('"' + shorten(bet.question) + '" just resolved'));
        }
      });
    return payouts;   // the App shows a toast for each of these
  };
}

/* ---- middleware: records every action for the "Under the hood" page ---- */
const actionLog = {
  entries: [],
  listeners: new Set(),
  push(type) {
    this.entries = [{ id: nanoid(), type, time: new Date().toLocaleTimeString() }, ...this.entries].slice(0, 30);
    this.listeners.forEach(listener => listener());
  }
};
const subscribeLog = listener => { actionLog.listeners.add(listener); return () => actionLog.listeners.delete(listener); };
const getLog = () => actionLog.entries;

const loggerMiddleware = () => next => action => {
  const result = next(action);
  if (action && action.type) actionLog.push(action.type);
  return result;
};

/* ---- build the store, restoring anything saved last time ---- */
function loadSavedState() {
  const saved = storage.load(STORE_KEY, null);
  if (!saved || !saved.bets || !Array.isArray(saved.bets.items)) return undefined;
  return {
    bets: saved.bets,
    wallet: saved.wallet || { clout: 1240 },
    feed: saved.feed || feedSlice.getInitialState(),
    wall: { ...wallInitial, mine: saved.wallMine || [] }
  };
}

const store = configureStore({
  reducer: {
    bets: betsSlice.reducer,
    wallet: walletSlice.reducer,
    feed: feedSlice.reducer,
    wall: wallSlice.reducer
  },
  preloadedState: loadSavedState(),
  middleware: getDefaultMiddleware => getDefaultMiddleware().concat(loggerMiddleware)
});

// Save to localStorage whenever the store changes (at most every 250ms).
let saveTimer = null;
let resetting = false;
store.subscribe(() => {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    if (resetting) return;
    const s = store.getState();
    storage.save(STORE_KEY, { bets: s.bets, wallet: s.wallet, feed: s.feed, wallMine: s.wall.mine });
  }, 250);
});

function resetProgress() {
  resetting = true;
  storage.remove(STORE_KEY);
  location.reload();
}

/* ---- selectors: small functions that read one thing from the store ---- */
const selectBets  = state => state.bets.items;
const selectClout = state => state.wallet.clout;
const selectFeed  = state => state.feed.items;
const selectWall  = state => state.wall;


/* =========================================================
   6. CUSTOM HOOKS
   ========================================================= */

/* Waits until the value stops changing for `delay` ms. Used for search boxes
   so we don't call an API on every key press. */
function useDebounce(value, delay = 300) {
  const [debounced, setDebounced] = useState(value);
  useEffect(() => {
    const timer = setTimeout(() => setDebounced(value), delay);
    return () => clearTimeout(timer);       // cancel if the value changes again first
  }, [value, delay]);
  return debounced;
}

/* useState that survives a page refresh. */
function useLocalStorage(key, initialValue) {
  const [value, setValue] = useState(() => storage.load(key, initialValue));
  useEffect(() => { storage.save(key, value); }, [key, value]);
  return [value, setValue];
}

/* One shared clock for every countdown on screen, using useSyncExternalStore.
   Only one setInterval runs no matter how many bet cards are visible. */
const clock = { now: Date.now(), listeners: new Set() };
setInterval(() => { clock.now = Date.now(); clock.listeners.forEach(l => l()); }, 1000);
const subscribeClock = l => { clock.listeners.add(l); return () => clock.listeners.delete(l); };
const getNow = () => clock.now;
function useNow() { return useSyncExternalStore(subscribeClock, getNow); }

/* Live list of Redux actions from the logger middleware. */
function useActionLog() { return useSyncExternalStore(subscribeLog, getLog); }

/* Calls handler when you click outside `ref` (closes dropdowns). */
function useClickOutside(ref, handler, active = true) {
  const handlerRef = useRef(handler);
  handlerRef.current = handler;
  useEffect(() => {
    if (!active) return;
    function onDown(e) { if (ref.current && !ref.current.contains(e.target)) handlerRef.current(e); }
    document.addEventListener("mousedown", onDown);
    document.addEventListener("touchstart", onDown);
    return () => {
      document.removeEventListener("mousedown", onDown);
      document.removeEventListener("touchstart", onDown);
    };
  }, [ref, active]);
}

/* A small form library: values, errors, touched fields and submit handling.
   `validate` is a plain function that returns { fieldName: "error message" }. */
function useForm({ initialValues, validate, onSubmit }) {
  const [values, setValues] = useState(initialValues);
  const [touched, setTouched] = useState({});
  const [submitCount, setSubmitCount] = useState(0);
  const [submitting, setSubmitting] = useState(false);

  const errors = useMemo(() => validate(values), [values, validate]);
  const isValid = Object.keys(errors).length === 0;

  // Only show an error once the field was left (blur) or the user tried to submit.
  function showError(name) {
    return touched[name] || submitCount > 0 ? errors[name] : undefined;
  }
  function handleChange(e) {
    const { name, value, type, checked } = e.target;
    setValues(v => ({ ...v, [name]: type === "checkbox" ? checked : value }));
  }
  function handleBlur(e) {
    const name = e.target.name;
    setTouched(t => ({ ...t, [name]: true }));
  }
  function setFieldValue(name, value) {
    setValues(v => ({ ...v, [name]: value }));
    setTouched(t => ({ ...t, [name]: true }));
  }
  async function handleSubmit(e) {
    if (e) e.preventDefault();
    setSubmitCount(c => c + 1);
    if (!isValid || submitting) return;
    setSubmitting(true);
    try { await onSubmit(values); }
    finally { setSubmitting(false); }
  }
  function reset(next) {
    setValues(next || initialValues);
    setTouched({});
    setSubmitCount(0);
  }

  return { values, errors, isValid, submitting, showError, handleChange, handleBlur, handleSubmit, setFieldValue, reset };
}

/* Runs any promise and tracks its loading / success / error state, with retry. */
function useAsync() {
  const [state, setState] = useState({ status: "idle", data: null, error: null });
  const last = useRef(null);
  const run = useCallback(async (factory, messages) => {
    last.current = { factory, messages };
    setState(s => ({ ...s, status: "loading", error: null }));
    try {
      const data = await factory();
      setState({ status: "success", data, error: null });
      return data;
    } catch (err) {
      setState({ status: "error", data: null, error: errorMessage(err, messages) });
    }
  }, []);
  const retry = useCallback(() => {
    if (last.current) run(last.current.factory, last.current.messages);
  }, [run]);
  return { ...state, run, retry };
}

/* Async validation: is this username free? Asks DummyJSON after you stop typing. */
function useUsernameCheck(username, enabled) {
  const debounced = useDebounce(username, 500);
  const [result, setResult] = useState({ status: "idle", for: "" });

  useEffect(() => {
    if (!enabled || !debounced) { setResult({ status: "idle", for: "" }); return; }
    if (TAKEN_USERNAMES.includes(debounced)) { setResult({ status: "taken", for: debounced }); return; }
    const controller = new AbortController();
    setResult({ status: "checking", for: debounced });
    api.get(ENDPOINTS.users + "/filter", { params: { key: "username", value: debounced }, signal: controller.signal })
      .then(res => setResult({ status: res.data.total > 0 ? "taken" : "available", for: debounced }))
      .catch(err => { if (!axios.isCancel(err)) setResult({ status: "unknown", for: debounced }); });
    return () => controller.abort();          // cancel the old request if the name changes
  }, [debounced, enabled]);

  if (!enabled || !username) return "idle";
  return result.for === username ? result.status : "checking";
}

/* Search TVMaze. Each new query cancels the previous request with AbortController. */
function useShowSearch(query) {
  const [state, setState] = useState({ status: "idle", data: [], error: null });
  const [attempt, setAttempt] = useState(0);

  useEffect(() => {
    if (!query) { setState({ status: "idle", data: [], error: null }); return; }
    const controller = new AbortController();
    setState(s => ({ ...s, status: "loading", error: null }));
    withRetry(() => api.get(ENDPOINTS.shows + "/search/shows", { params: { q: query }, signal: controller.signal }))
      .then(res => setState({ status: "success", data: res.data.map(r => r.show), error: null }))
      .catch(err => {
        if (axios.isCancel(err)) return;
        setState({ status: "error", data: [], error: errorMessage(err) });
      });
    return () => controller.abort();
  }, [query, attempt]);

  return { ...state, retry: () => setAttempt(a => a + 1) };
}

/* Browse TVMaze page by page (250 shows per API page), revealing 12 at a time.
   useReducer keeps the related bits of state changing together. */
const BROWSE_CHUNK = 12;
const browseInitial = { items: [], visible: 0, apiPage: 0, status: "idle", error: null, hasMore: true };

function browseReducer(state, action) {
  switch (action.type) {
    case "reveal":  return { ...state, visible: Math.min(state.visible + BROWSE_CHUNK, state.items.length) };
    case "loading": return { ...state, status: "loading", error: null };
    case "loaded": {
      const items = state.items.concat(action.shows);
      return { ...state, items, status: "idle", apiPage: state.apiPage + 1,
               visible: Math.min(state.visible + BROWSE_CHUNK, items.length) };
    }
    case "end":     return { ...state, status: "idle", hasMore: false };
    case "error":   return { ...state, status: "error", error: action.error };
    default:        return state;
  }
}

function useShowBrowser() {
  const [state, send] = useReducer(browseReducer, browseInitial);
  const stateRef = useRef(state);
  stateRef.current = state;

  const loadMore = useCallback(async () => {
    const s = stateRef.current;
    if (s.status === "loading" || s.status === "error") return;
    if (s.visible < s.items.length) { send({ type: "reveal" }); return; }   // still have some in memory
    if (!s.hasMore) return;
    stateRef.current = { ...s, status: "loading" };                          // block double calls
    send({ type: "loading" });
    try {
      const res = await withRetry(() => api.get(ENDPOINTS.shows + "/shows", { params: { page: s.apiPage } }));
      send({ type: "loaded", shows: res.data.filter(show => show.image) });
    } catch (err) {
      if (err.response && err.response.status === 404) send({ type: "end" });   // no more pages
      else send({ type: "error", error: errorMessage(err) });
    }
  }, []);

  const retry = useCallback(() => {
    stateRef.current = { ...stateRef.current, status: "idle" };
    loadMore();
  }, [loadMore]);

  return { ...state, loadMore, retry };
}

/* Infinite scroll: watches an invisible div at the bottom of the list with
   IntersectionObserver and calls onLoadMore when it comes into view. */
function useInfiniteScroll(onLoadMore, enabled, deps) {
  const sentinelRef = useRef(null);
  const onScreen = useRef(false);
  const callback = useRef(onLoadMore);
  callback.current = onLoadMore;

  useEffect(() => {
    const el = sentinelRef.current;
    if (!el || !enabled) return;
    const observer = new IntersectionObserver(([entry]) => {
      onScreen.current = entry.isIntersecting;
      if (entry.isIntersecting) callback.current();
    }, { rootMargin: "300px" });
    observer.observe(el);
    return () => { observer.disconnect(); onScreen.current = false; };
  }, [enabled]);

  // If the list is still too short to push the sentinel off screen, keep loading.
  useEffect(() => {
    if (!enabled || !onScreen.current) return;
    const timer = setTimeout(() => callback.current(), 150);
    return () => clearTimeout(timer);
  }, deps); // eslint-disable-line

  return sentinelRef;
}


/* =========================================================
   7. CONTEXT PROVIDERS
   Context is for app-wide things that aren't "data": who is logged in,
   sound on/off, the toast popup, and the new-bet composer.
   ========================================================= */

/* ---- Settings (sound) ---- */
const SettingsContext = createContext(null);
const useSettings = () => useContext(SettingsContext);

function SettingsProvider({ children }) {
  const [soundOn, setSoundOn] = useLocalStorage("bolbet-sound", true);
  const audioRef = useRef(null);

  // A short beep made by the browser itself, so we need no sound files.
  const play = useCallback(frequency => {
    if (!soundOn) return;
    try {
      if (!audioRef.current) audioRef.current = new (window.AudioContext || window.webkitAudioContext)();
      const audio = audioRef.current;
      const wave = audio.createOscillator();
      const volume = audio.createGain();
      wave.frequency.value = frequency;
      volume.gain.value = 0.05;
      wave.connect(volume);
      volume.connect(audio.destination);
      wave.start();
      wave.stop(audio.currentTime + 0.12);
    } catch (e) { /* browsers may block sound until the first click */ }
  }, [soundOn]);

  const toggleSound = useCallback(() => setSoundOn(on => !on), [setSoundOn]);
  const value = useMemo(() => ({ soundOn, toggleSound, play }), [soundOn, toggleSound, play]);
  return <SettingsContext.Provider value={value}>{children}</SettingsContext.Provider>;
}

/* ---- Toasts ---- */
const ToastContext = createContext(null);
const useToast = () => useContext(ToastContext);

function ToastProvider({ children }) {
  const [toasts, setToasts] = useState([]);
  const dismiss = useCallback(id => setToasts(list => list.filter(t => t.id !== id)), []);
  const toast = useCallback((message, type = "success") => {
    const id = nanoid();
    setToasts(list => [...list.slice(-2), { id, message, type }]);   // keep max 3 on screen
    setTimeout(() => dismiss(id), 2600);
  }, [dismiss]);

  return (
    <ToastContext.Provider value={toast}>
      {children}
      <div className="toasts" role="status" aria-live="polite">
        {toasts.map(t => (
          <div key={t.id} className={"toast " + t.type} onClick={() => dismiss(t.id)}>{t.message}</div>
        ))}
      </div>
    </ToastContext.Provider>
  );
}

/* ---- Auth (the registered user) ---- */
const AuthContext = createContext(null);
const useAuth = () => useContext(AuthContext);

/* =========================================================
   8. ROUTER
   A tiny hash router: #/bets?cat=Sports -> path "bets", query cat=Sports.
   Hash URLs work when the file is opened straight from disk.
   ========================================================= */

function parseHash() {
  const raw = window.location.hash.replace(/^#\/?/, "");
  const [path, qs] = raw.split("?");
  return { path: path || "home", query: new URLSearchParams(qs || "") };
}

function useHashRoute() {
  const [hash, setHash] = useState(window.location.hash);
  useEffect(() => {
    const onChange = () => setHash(window.location.hash);
    window.addEventListener("hashchange", onChange);
    return () => window.removeEventListener("hashchange", onChange);
  }, []);
  const route = useMemo(parseHash, [hash]);

  // Jump to the top only when the page changes, not when a filter in the URL changes.
  const lastPath = useRef(route.path);
  useEffect(() => {
    if (lastPath.current !== route.path) { window.scrollTo(0, 0); lastPath.current = route.path; }
  }, [route.path]);
  return route;
}

function navigate(to) { window.location.hash = "/" + to; }

function Link({ to, children, ...rest }) {
  return <a href={"#/" + to} {...rest}>{children}</a>;
}

function Modal({ open, onClose, title, hint, width = 440, center, children }) {
  const boxRef = useRef(null);
  const closeRef = useRef(onClose);
  closeRef.current = onClose;

  useEffect(() => {
    if (!open) return;
    const onKey = e => { if (e.key === "Escape") closeRef.current(); };
    document.addEventListener("keydown", onKey);
    document.body.style.overflow = "hidden";                  // stop the page scrolling behind
    const first = boxRef.current && boxRef.current.querySelector("input, textarea, select");
    if (first) first.focus();
    return () => { document.removeEventListener("keydown", onKey); document.body.style.overflow = ""; };
  }, [open]);

  if (!open) return null;
  // A portal renders the modal at the end of <body>, outside the page layout.
  return ReactDOM.createPortal(
    <div className="overlay" onMouseDown={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal" ref={boxRef} role="dialog" aria-modal="true" aria-label={title}
           style={{ maxWidth: width, textAlign: center ? "center" : undefined }}>
        <h3>{title}</h3>
        {hint && <p className="hint">{hint}</p>}
        {children}
      </div>
    </div>,
    document.body
  );
}

function Tabs({ tabs, active, onChange }) {
  return (
    <div className="chips" role="tablist">
      {tabs.map(tab => (
        <button key={tab.id} type="button" role="tab" aria-selected={active === tab.id}
                className={"chip" + (active === tab.id ? " active" : "")} onClick={() => onChange(tab.id)}>
          {tab.label}
          {tab.count != null && <span className="count-badge">{tab.count}</span>}
        </button>
      ))}
    </div>
  );
}

function Dropdown({ label, items, value, onSelect, align = "left", buttonClass = "dropdown-btn", showValue = true }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useClickOutside(ref, () => setOpen(false), open);

  useEffect(() => {
    if (!open) return;
    const onKey = e => { if (e.key === "Escape") setOpen(false); };
    document.addEventListener("keydown", onKey);
    return () => document.removeEventListener("keydown", onKey);
  }, [open]);

  const current = items.find(item => item.value === value);
  return (
    <div className="dropdown" ref={ref}>
      <button type="button" className={buttonClass} aria-haspopup="menu" aria-expanded={open}
              onClick={() => setOpen(o => !o)}>
        {showValue && label && <small>{label}</small>}
        {showValue && current ? current.label : label}
        <Icon name="chevron" size={14} />
      </button>
      {open && (
        <div className={"dropdown-menu " + align} role="menu">
          {items.map(item => (
            <button key={item.value} type="button" role="menuitem"
                    className={"dropdown-item" + (item.value === value ? " selected" : "")}
                    onClick={() => { setOpen(false); onSelect(item.value); }}>
              {item.label}
              {item.value === value && <Icon name="check" size={14} />}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

function Pagination({ page, totalPages, onChange }) {
  if (totalPages <= 1) return null;
  const start = Math.max(1, Math.min(page - 2, totalPages - 4));
  const end = Math.min(totalPages, start + 4);
  const pages = [];
  for (let p = start; p <= end; p++) pages.push(p);

  return (
    <nav className="pagination" aria-label="Pagination">
      <button className="page-btn" disabled={page === 1} onClick={() => onChange(page - 1)} aria-label="Previous page">‹</button>
      {start > 1 && <button className="page-btn" onClick={() => onChange(1)}>1</button>}
      {start > 2 && <span className="dots">…</span>}
      {pages.map(p => (
        <button key={p} className={"page-btn" + (p === page ? " active" : "")} aria-current={p === page ? "page" : undefined}
                onClick={() => onChange(p)}>{p}</button>
      ))}
      {end < totalPages - 1 && <span className="dots">…</span>}
      {end < totalPages && <button className="page-btn" onClick={() => onChange(totalPages)}>{totalPages}</button>}
      <button className="page-btn" disabled={page === totalPages} onClick={() => onChange(page + 1)} aria-label="Next page">›</button>
    </nav>
  );
}

function ErrorState({ message, onRetry, title = "That didn't work" }) {

function Skeletons({ count = 6, height = 200 }) {

/* Error boundary: if a page crashes, show a message instead of a blank screen.
   (Error boundaries must still be class components.) */
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  render() {
    if (this.state.error) {
      return (
        <Section title="Something broke">
          <ErrorState message={String(this.state.error.message || this.state.error)}
                      onRetry={() => this.setState({ error: null })} />
        </Section>
      );
    }
    return this.props.children;
  }
}


/* =========================================================
   10. REUSABLE FORM INPUTS
   Every input takes the `form` object from useForm, so wiring a new field
   is one line: <TextInput form={form} name="email" label="Email" />
   ========================================================= */

function Field({ label, htmlFor, required, error, hint, hintOk, children }) {
  return (
    <div className={"field" + (error ? " has-error" : "")}>
      {label && <label htmlFor={htmlFor}>{label}{required && <span className="req">*</span>}</label>}
      {children}
      {error
        ? <p className="field-error" role="alert">{error}</p>
        : hint ? <p className={"field-hint" + (hintOk ? " ok" : "")}>{hint}</p> : null}
    </div>
  );
}

function TextInput({ form, name, label, hint, hintOk, required, counter, type = "text", error, ...rest }) {
  const shownError = error || form.showError(name);
  const length = String(form.values[name] || "").length;
  const finalHint = hint || (counter && rest.maxLength ? length + " / " + rest.maxLength : null);
  return (
    <Field label={label} htmlFor={name} required={required} error={shownError} hint={finalHint} hintOk={hintOk}>
      <input id={name} name={name} type={type} className="input" value={form.values[name]}
             onChange={form.handleChange} onBlur={form.handleBlur} aria-invalid={!!shownError} {...rest} />
    </Field>
  );
}

function TextArea({ form, name, label, required, maxLength, ...rest }) {
  const error = form.showError(name);
  return (
    <Field label={label} htmlFor={name} required={required} error={error}
           hint={maxLength ? form.values[name].length + " / " + maxLength : null}>
      <textarea id={name} name={name} className="input" value={form.values[name]} maxLength={maxLength}
                onChange={form.handleChange} onBlur={form.handleBlur} aria-invalid={!!error} {...rest} />
    </Field>
  );
}

function SelectInput({ form, name, label, options, required, placeholder }) {
  const error = form.showError(name);
  const list = options.map(o => (typeof o === "string" ? { value: o, label: o } : o));
  return (
    <Field label={label} htmlFor={name} required={required} error={error}>
      <select id={name} name={name} className="input" value={form.values[name]}
              onChange={form.handleChange} onBlur={form.handleBlur} aria-invalid={!!error}>
        {placeholder && <option value="">{placeholder}</option>}
        {list.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
      </select>
    </Field>
  );
}

function PasswordInput({ form, name, label, required, showMeter, ...rest }) {
  const [visible, setVisible] = useState(false);       // local state: only this input cares
  const error = form.showError(name);
  const score = passwordScore(form.values[name]);
  const colours = ["var(--pink)", "var(--pink)", "var(--orange)", "var(--cyan)", "var(--lime)"];
  const words = ["Too weak", "Weak", "Okay", "Strong", "Very strong"];
  return (
    <Field label={label} htmlFor={name} required={required} error={error}
           hint={showMeter && form.values[name] ? "Strength: " + words[score] : null}>
      <div className="input-row">
        <input id={name} name={name} type={visible ? "text" : "password"} className="input"
               value={form.values[name]} onChange={form.handleChange} onBlur={form.handleBlur}
               aria-invalid={!!error} style={{ paddingRight: 70 }} {...rest} />
        <button type="button" className="peek" onClick={() => setVisible(v => !v)}>{visible ? "Hide" : "Show"}</button>
      </div>
      {showMeter && (
        <div className="strength" aria-hidden="true">
          {[1, 2, 3, 4].map(i => <span key={i} style={{ background: i <= score ? colours[score] : undefined }} />)}
        </div>
      )}
    </Field>
  );
}

function Checkbox({ form, name, label }) {
  return (
    <Field error={form.showError(name)}>
      <label className="check">
        <input type="checkbox" name={name} checked={form.values[name]} onChange={form.handleChange} onBlur={form.handleBlur} />
        <span>{label}</span>
      </label>
    </Field>
  );
}

function CheckboxGroup({ form, name, label, options, required }) {
  const selected = form.values[name];
  function toggle(option) {
    form.setFieldValue(name, selected.includes(option) ? selected.filter(o => o !== option) : [...selected, option]);
  }
  return (
    <Field label={label} required={required} error={form.showError(name)}>
      <div className="pill-group" role="group" aria-label={label}>
        {options.map(option => (
          <label key={option} className={"pill-check" + (selected.includes(option) ? " on" : "")}>
            <input type="checkbox" checked={selected.includes(option)} onChange={() => toggle(option)} />
            {option}
          </label>
        ))}
      </div>
    </Field>
  );
}

function OptionButton({ side, label, percent, showBars, picked, won, disabled, onClick }) {

function BetCard({ bet }) {
  const dispatch = useDispatch();
  const toast = useToast();
  const { play } = useSettings();
  const now = useNow();
  const [sharing, setSharing] = useState(false);

  const total = totalVotes(bet);
  const percentA = total === 0 ? 50 : Math.round(bet.votesA / total * 100);
  const showBars = bet.myVote !== null || bet.closed;    // percentages appear after you vote
  const msLeft = bet.closesAt - now;

  function handleVote(side) {
    if (dispatch(placeVote(bet.id, side))) { play(560); toast("Vote placed, +10 clout"); }
  }
  function handleDelete() {
    if (window.confirm("Delete this bet?")) { dispatch(betDeleted(bet.id)); toast("Bet deleted", "info"); }
  }

  let footRight = "Pick a side";
  if (bet.closed && bet.myVote) {
    footRight = bet.payout > 0
      ? <span className="result win">You won +{bet.payout} clout</span>
      : <span className="result loss">You lost {Math.abs(bet.payout)} clout</span>;
  } else if (bet.closed) {
    footRight = "Closed";
  } else if (bet.myVote) {
    footRight = "You picked " + (bet.myVote === "A" ? bet.optionA : bet.optionB);
  }

  return (
    <article className="bet">
      <div className="bet-top">
        <span className="category">{bet.category}</span>
        <span className={"timer" + (bet.closed || msLeft < 3600000 ? " soon" : "")}>
          {bet.closed ? "CLOSED" : formatTimeLeft(msLeft)}
        </span>
      </div>
      <Icon name={CATEGORY_ICON[bet.category] || "dice"} size={28} color={CATEGORY_COLOUR[bet.category]} />
      <div className="question">{bet.question}</div>

      <OptionButton side="A" label={bet.optionA} percent={percentA} showBars={showBars}
                    picked={bet.myVote === "A"} won={bet.winner === "A"} disabled={showBars} onClick={() => handleVote("A")} />
      <OptionButton side="B" label={bet.optionB} percent={100 - percentA} showBars={showBars}
                    picked={bet.myVote === "B"} won={bet.winner === "B"} disabled={showBars} onClick={() => handleVote("B")} />

      <div className="bet-foot"><span>{total} votes</span><span>{footRight}</span></div>

      <div className="reactions">
        {[["doubt", "Doubt", "skull"], ["hype", "Hype", "flame"], ["shook", "Shook", "bolt"]].map(([key, text, icon]) => (
          <button key={key} className="react" aria-label={text} title={text}
                  onClick={() => { dispatch(reacted({ id: bet.id, key })); play(880); }}>
            <Icon name={icon} size={14} /> {bet.reactions[key]}
          </button>
        ))}
        {bet.myVote && (
          <button className="react push-right" onClick={() => setSharing(true)}><Icon name="share" size={14} /> Share</button>
        )}
        {bet.mine && (
          <button className={"react danger" + (bet.myVote ? "" : " push-right")} onClick={handleDelete} aria-label="Delete bet">
            <Icon name="trash" size={14} />
          </button>
        )}
      </div>

      <ShareModal bet={bet} open={sharing} onClose={() => setSharing(false)} />
    </article>
  );
}

/* Canvas can't wrap text by itself, so we add words until the line is too wide. */
function drawWrappedText(pen, text, x, y, maxWidth, lineHeight) {
  const words = text.split(" ");
  let line = "";
  for (let i = 0; i < words.length; i++) {
    const testLine = line + words[i] + " ";
    if (pen.measureText(testLine).width > maxWidth && i > 0) {
      pen.fillText(line, x, y);
      line = words[i] + " ";
      y += lineHeight;
    } else {
      line = testLine;
    }
  }
  pen.fillText(line, x, y);
  return y;
}

function drawShareCard(canvas, bet, handle) {
  const pen = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  pen.fillStyle = "#141026"; pen.fillRect(0, 0, W, H);
  pen.fillStyle = "rgba(255,62,160,.25)"; pen.beginPath(); pen.arc(W - 60, 60, 150, 0, Math.PI * 2); pen.fill();
  pen.fillStyle = "#c6ff3d"; pen.font = "bold 38px Arial"; pen.fillText("BOLBET", 40, 70);
  pen.fillStyle = "#a79fc4"; pen.font = "bold 16px Arial"; pen.fillText(bet.category.toUpperCase(), 40, 108);
  pen.fillStyle = "#f6f3ff"; pen.font = "bold 28px Arial";
  const y = drawWrappedText(pen, bet.question, 40, 170, 520, 36);
  pen.fillStyle = "#a79fc4"; pen.font = "bold 18px Arial"; pen.fillText(handle ? handle.toUpperCase() + "'S CALL" : "YOUR CALL", 40, y + 60);
  pen.fillStyle = "#c6ff3d"; pen.font = "bold 26px Arial"; pen.fillText(bet.myVote === "A" ? bet.optionA : bet.optionB, 40, y + 96);

  let resultText = "IN PLAY", resultColour = "#3ed9ff";
  if (bet.closed) {
    if (bet.payout > 0) { resultText = "WON +" + bet.payout + " CLOUT"; resultColour = "#c6ff3d"; }
    else { resultText = "LOST " + Math.abs(bet.payout) + " CLOUT"; resultColour = "#ff3ea0"; }
  }
  pen.fillStyle = resultColour; pen.font = "bold 28px Arial"; pen.fillText(resultText, 40, H - 90);
  pen.fillStyle = "#a79fc4"; pen.font = "16px Arial"; pen.fillText("No real money, just clout.", 40, H - 40);
}

function ShareModal({ bet, open, onClose }) {
  const canvasRef = useRef(null);
  const { user } = useAuth();
  useEffect(() => {
    if (open && canvasRef.current) drawShareCard(canvasRef.current, bet, user ? "@" + user.username : null);
  }, [open, bet, user]);

  function download() {
    const link = document.createElement("a");
    link.download = "bolbet.png";
    link.href = canvasRef.current.toDataURL();
    link.click();
  }

  return (
    <Modal open={open} onClose={onClose} title="Share your call" hint="Screenshot ready." width={360} center>
      <canvas ref={canvasRef} id="shareCanvas" width="600" height="700" />
      <div className="modal-buttons">
        <button className="btn-outline" onClick={onClose}>Close</button>
        <button className="btn" onClick={download}>Download</button>
      </div>
    </Modal>
  );
}

const BET_DEFAULTS = { question: "", optionA: "", optionB: "", category: "Campus Drama", hours: "24" };

function validateBet(v) {
  const errors = {};
  const question = v.question.trim();
  if (!question) errors.question = "Ask something.";
  else if (question.length < 10) errors.question = "Too short, use at least 10 characters.";
  else if (!question.endsWith("?")) errors.question = "Make it a question (end it with ?).";
  if (!v.optionA.trim()) errors.optionA = "Option A can't be empty.";
  if (!v.optionB.trim()) errors.optionB = "Option B can't be empty.";
  else if (v.optionA.trim().toLowerCase() === v.optionB.trim().toLowerCase()) errors.optionB = "Both sides can't say the same thing.";
  return errors;
}

function NewBetModal({ open, prefill, onClose }) {
  const dispatch = useDispatch();
  const toast = useToast();
  const { play } = useSettings();

  const form = useForm({
    initialValues: BET_DEFAULTS,
    validate: validateBet,
    onSubmit: async values => {
      dispatch(betAdded({
        question: values.question.trim(), optionA: values.optionA.trim(), optionB: values.optionB.trim(),
        category: values.category, hours: Number(values.hours)
      }));
      toast("Bet posted");
      play(660);
      onClose();
      navigate("bets?sort=newest");
    }
  });

  // Every time the modal opens, start from the defaults plus any pre-filled values.
  useEffect(() => {
    if (open) form.reset({ ...BET_DEFAULTS, ...(prefill || {}) });
  }, [open, prefill]); // eslint-disable-line

  return (
    <Modal open={open} onClose={onClose} title="Drop a bet" hint="Make it juicy. Vague bets get ignored.">
      <form onSubmit={form.handleSubmit} noValidate>
        <TextInput form={form} name="question" label="The question" required counter maxLength={90}
                   placeholder="Will Raj actually show up on time?" />
        <div className="form-grid">
          <TextInput form={form} name="optionA" label="Option A" required maxLength={30} placeholder="Yes, miracles happen" />
          <TextInput form={form} name="optionB" label="Option B" required maxLength={30} placeholder="No, lost cause" />
          <SelectInput form={form} name="category" label="Category" options={CATEGORIES.slice(1)} />
          <SelectInput form={form} name="hours" label="Closes in" options={DURATIONS} />
        </div>
        <div className="modal-buttons">
          <button type="button" className="btn-outline" onClick={onClose}>Cancel</button>
          <button type="submit" className="btn">Post bet</button>
        </div>
      </form>
    </Modal>
  );
}
