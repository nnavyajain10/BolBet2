/* ---------- BETS (search + filter + sort + pagination) ---------- */
const BET_SORTS = [
  { value: "trending", label: "Trending" }, { value: "closing", label: "Closing soon" },
  { value: "newest", label: "Newest" }, { value: "split", label: "Most divided" }
];
const BET_STATUS = [
  { value: "all", label: "Everything" }, { value: "open", label: "Open only" },
  { value: "voted", label: "I voted" }, { value: "closed", label: "Closed" }
];
const BETS_PER_PAGE = 6;

function BetsPage({ query }) {
  const bets = useSelector(selectBets);
  const openComposer = useComposer();

  // The category lives in the URL (#/bets?cat=Sports) so tiles on Home can link to it.
  const category = CATEGORIES.includes(query.get("cat")) ? query.get("cat") : "All";
  const [search, setSearch] = useState("");
  const debounced = useDebounce(search.trim().toLowerCase(), 300);
  const [sortBy, setSortBy] = useState(query.get("sort") || "trending");
  const [status, setStatus] = useState("all");

  // Derived state: when any filter changes the "key" changes and we're back on page 1,
  // without needing an extra useEffect.
  const filterKey = [category, debounced, sortBy, status].join("|");
  const [paging, setPaging] = useState({ key: filterKey, page: 1 });
  const page = paging.key === filterKey ? paging.page : 1;

  const list = useMemo(() => {
    const result = bets.filter(bet => {
      if (category !== "All" && bet.category !== category) return false;
      if (status === "open" && bet.closed) return false;
      if (status === "closed" && !bet.closed) return false;
      if (status === "voted" && !bet.myVote) return false;
      if (!debounced) return true;
      const haystack = (bet.question + " " + bet.optionA + " " + bet.optionB + " " + bet.category).toLowerCase();
      return haystack.includes(debounced);
    });
    const split = b => Math.abs(50 - (totalVotes(b) ? b.votesA / totalVotes(b) * 100 : 50));
    if (sortBy === "closing") result.sort((x, y) => (x.closed - y.closed) || (x.closesAt - y.closesAt));
    else if (sortBy === "newest") result.sort((x, y) => y.createdAt - x.createdAt);
    else if (sortBy === "split") result.sort((x, y) => split(x) - split(y));
    else result.sort(byVotes);
    return result;
  }, [bets, category, debounced, sortBy, status]);

  const totalPages = Math.max(1, Math.ceil(list.length / BETS_PER_PAGE));
  const safePage = Math.min(page, totalPages);
  const visible = list.slice((safePage - 1) * BETS_PER_PAGE, safePage * BETS_PER_PAGE);

  function goToPage(p) { setPaging({ key: filterKey, page: p }); window.scrollTo({ top: 0, behavior: "smooth" }); }
  function chooseCategory(cat) { navigate(cat === "All" ? "bets" : "bets?cat=" + encodeURIComponent(cat)); }

  return (
    <Section title="The board" subtitle="Pick a side. You can't un-vote, so choose wisely."
             action={<button className="btn" onClick={() => openComposer(category !== "All" ? { category } : null)}>+ New Bet</button>}>
      <div className="filters">
        <SearchBox value={search} onChange={setSearch} placeholder="Search bets... 'wifi', 'quiz', 'drama'"
                   pending={search.trim().toLowerCase() !== debounced} />
        <Dropdown label="Show" items={BET_STATUS} value={status} onSelect={setStatus} align="right" />
        <Dropdown label="Sort" items={BET_SORTS} value={sortBy} onSelect={setSortBy} align="right" />
      </div>

      <div className="chips">
        {CATEGORIES.map(cat => (
          <button key={cat} className={"chip" + (cat === category ? " active" : "")} onClick={() => chooseCategory(cat)}>{cat}</button>
        ))}
      </div>

      {list.length > 0 && (
        <p className="result-meta">
          Showing {(safePage - 1) * BETS_PER_PAGE + 1}–{Math.min(safePage * BETS_PER_PAGE, list.length)} of {list.length} bets
        </p>
      )}

      <div className="grid">
        {visible.length === 0
          ? <EmptyState title="No bets match that">Try another search, category or filter.</EmptyState>
          : visible.map(bet => <BetCard key={bet.id} bet={bet} />)}
      </div>

      <Pagination page={safePage} totalPages={totalPages} onChange={goToPage} />
    </Section>
  );
}

/* ---------- DISCOVER (TVMaze: debounced search + infinite scroll) ---------- */
const GENRES = ["All", "Drama", "Comedy", "Thriller", "Romance", "Science-Fiction", "Action", "Crime", "Horror"];
const SHOW_SORTS = [
  { value: "default", label: "Best match" }, { value: "rating", label: "Top rated" },
  { value: "newest", label: "Newest" }, { value: "name", label: "A to Z" }
];

function ShowCard({ show }) {
  const openComposer = useComposer();
  const year = show.premiered ? show.premiered.slice(0, 4) : "—";
  const rating = show.rating && show.rating.average;
  const running = show.status === "Running";
  const name = shorten(show.name, 45);

  function makeBet() {
    openComposer(running
      ? { question: "Will " + name + " get another season?", optionA: "Renewed, easy", optionB: "Cancelled, RIP", category: "Pop Culture", hours: "72" }
      : { question: "Is " + name + " worth a full rewatch?", optionA: "Peak TV, yes", optionB: "Leave it in the past", category: "Pop Culture", hours: "24" });
  }

  return (
    <article className="show">
      {show.image
        ? <img src={show.image.medium} alt={show.name + " poster"} loading="lazy" />
        : <div className="no-img"><Icon name="tv" size={30} /></div>}
      <div>
        <h4>{show.name}</h4>
        <div className="meta">
          {year} · {rating ? "★ " + rating : "no rating"} · <span className={running ? "running" : "ended"}>{show.status}</span>
        </div>
        <div className="tag-row">{(show.genres || []).slice(0, 3).map(g => <span className="tag" key={g}>{g}</span>)}</div>
        {show.summary && <p className="summary">{stripHtml(show.summary)}</p>}
        <div className="show-actions">
          <button className="btn btn-sm" onClick={makeBet}>Bet on it</button>
          <a className="btn-outline btn-sm" href={show.url} target="_blank" rel="noopener noreferrer">
            Details <Icon name="external" size={13} />
          </a>
        </div>
      </div>
    </article>
  );
}

function DiscoverPage() {
  const [input, setInput] = useState("");
  const query = useDebounce(input.trim(), 450);
  const searching = query.length > 0;
  const search = useShowSearch(query);
  const browser = useShowBrowser();
  const [genre, setGenre] = useState("All");
  const [sortBy, setSortBy] = useState("default");

  const source = searching ? search.data : browser.items.slice(0, browser.visible);
  const shows = useMemo(() => {
    let list = genre === "All" ? source : source.filter(s => (s.genres || []).includes(genre));
    const rate = s => (s.rating && s.rating.average) || 0;
    if (sortBy === "rating") list = [...list].sort((a, b) => rate(b) - rate(a));
    else if (sortBy === "newest") list = [...list].sort((a, b) => (b.premiered || "").localeCompare(a.premiered || ""));
    else if (sortBy === "name") list = [...list].sort((a, b) => a.name.localeCompare(b.name));
    return list;
  }, [source, genre, sortBy]);

  const scrollEnabled = !searching && browser.hasMore && browser.status !== "error";
  const sentinelRef = useInfiniteScroll(browser.loadMore, scrollEnabled,
                                        [browser.visible, browser.items.length, browser.status, genre]);

  let body;
  if (searching) {
    if (search.status === "loading") body = <Skeletons count={6} height={170} />;
    else if (search.status === "error") body = <ErrorState message={search.error} onRetry={search.retry} />;
    else if (shows.length === 0) body = <EmptyState title={'Nothing for "' + query + '"'}>Check the spelling or try another genre.</EmptyState>;
    else body = shows.map(show => <ShowCard key={show.id} show={show} />);
  } else if (browser.items.length === 0 && browser.status !== "error") {
    body = <Skeletons count={6} height={170} />;
  } else {
    body = shows.map(show => <ShowCard key={show.id} show={show} />);
  }

  return (
    <Section title="Discover" subtitle="Search any TV show and turn it into a bet. Scroll forever, we'll keep loading.">
      <div className="filters">
        <SearchBox value={input} onChange={setInput} placeholder="Search shows... 'friends', 'kota', 'office'"
                   pending={input.trim() !== query} />
        <Dropdown label="Genre" items={GENRES.map(g => ({ value: g, label: g }))} value={genre} onSelect={setGenre} align="right" />
        <Dropdown label="Sort" items={SHOW_SORTS} value={sortBy} onSelect={setSortBy} align="right" />
      </div>
      {searching && search.status === "success" && (
        <p className="result-meta">{shows.length} result{shows.length === 1 ? "" : "s"} for "{query}"</p>
      )}

      <div className="grid">{body}</div>

      {!searching && (
        <>
          {browser.status === "loading" && browser.items.length > 0 && (
            <div className="load-row"><span className="spinner" /> Loading more shows…</div>
          )}
          {browser.status === "error" && (
            <div className="grid" style={{ marginTop: 18 }}>
              <ErrorState title="Couldn't load more shows" message={browser.error} onRetry={browser.retry} />
            </div>
          )}
          {scrollEnabled && <div ref={sentinelRef} className="sentinel" />}
          {!browser.hasMore && <div className="load-row">That's every show. You've reached the end.</div>}
        </>
      )}
      <p className="credit">TV data from <a href="https://www.tvmaze.com/api" target="_blank" rel="noopener noreferrer">TVMaze</a> (CC BY-SA).</p>
    </Section>
  );
}

/* ---------- WALL (CRUD with Redux async thunks + server pagination) ---------- */
function validatePost(v) {
  const errors = {};
  const title = v.title.trim(), body = v.body.trim();
  if (!title) errors.title = "Give it a headline.";
  else if (title.length < 5) errors.title = "At least 5 characters.";
  if (!body) errors.body = "Say what you actually think.";
  else if (body.length < 10) errors.body = "At least 10 characters.";
  return errors;
}

function EditPostModal({ post, onClose }) {
  const dispatch = useDispatch();
  const toast = useToast();
  const form = useForm({
    initialValues: { title: post ? post.title : "", body: post ? post.body : "" },
    validate: validatePost,
    onSubmit: async values => {
      try {
        await dispatch(updatePost({ post, changes: { title: values.title.trim(), body: values.body.trim() } })).unwrap();
        toast("Post updated");
        onClose();
      } catch (message) {
        toast(typeof message === "string" ? message : "Couldn't save that", "error");
      }
    }
  });
  return (
    <Modal open={!!post} onClose={onClose} title="Edit your take" width={520}>
      <form onSubmit={form.handleSubmit} noValidate>
        <TextInput form={form} name="title" label="Headline" required maxLength={80} counter />
        <TextArea form={form} name="body" label="Your take" required maxLength={280} />
        <div className="modal-buttons">
          <button type="button" className="btn-outline" onClick={onClose}>Cancel</button>
          <button type="submit" className="btn" disabled={form.submitting}>
            {form.submitting ? <><span className="spinner" /> Saving</> : "Save changes"}
          </button>
        </div>
      </form>
    </Modal>
  );
}

function PostCard({ post, busy, onEdit }) {
  const dispatch = useDispatch();
  const toast = useToast();
  const author = post.local ? post.author : "Student #" + post.userId;
  const seed = post.local ? post.author : "student" + post.userId;

  async function handleDelete() {
    if (!window.confirm("Delete this post?")) return;
    try {
      await dispatch(deletePost(post)).unwrap();
      toast("Post deleted", "info");
    } catch (message) {
      toast(typeof message === "string" ? message : "Couldn't delete that", "error");
    }
  }

  return (
    <article className={"post" + (post.local ? " mine" : "") + (busy ? " busy" : "")}>
      <div className="post-head">
        <img src={avatarUrl(seed)} alt="" />
        <div>
          <div className="who">{author}</div>
          <div className="when">{post.local ? timeAgo(post.createdAt) : "from the archive"}{post.edited ? " · edited" : ""}</div>
        </div>
        {busy && <span className="spinner push-right" style={{ color: "var(--lime)" }} />}
      </div>
      <h4>{post.title}</h4>
      <p>{post.body}</p>
      {post.tags.length > 0 && <div className="tag-row">{post.tags.map(t => <span className="tag" key={t}>#{t}</span>)}</div>}
      <div className="post-actions">
        <button className={"react" + (post.liked ? " liked" : "")} onClick={() => dispatch(postLiked(post.id))} aria-pressed={post.liked}>
          <Icon name="heart" size={14} /> {post.likes}
        </button>
        <button className="react push-right" onClick={() => onEdit(post)}><Icon name="edit" size={14} /> Edit</button>
        <button className="react danger" onClick={handleDelete} aria-label="Delete post"><Icon name="trash" size={14} /></button>
      </div>
    </article>
  );
}

function WallPage() {
  const dispatch = useDispatch();
  const toast = useToast();
  const { user } = useAuth();
  const wall = useSelector(selectWall);
  const [search, setSearch] = useState("");
  const query = useDebounce(search.trim(), 400);
  const [paging, setPaging] = useState({ query: "", page: 1 });
  const page = paging.query === query ? paging.page : 1;
  const [editing, setEditing] = useState(null);

  // Fetch whenever the page or search changes. The thunk's "condition" skips
  // the request if Redux already holds that exact page.
  useEffect(() => { dispatch(fetchWall({ page, query })); }, [dispatch, page, query]);

  const form = useForm({
    initialValues: { title: "", body: "" },
    validate: validatePost,
    onSubmit: async values => {
      try {
        await dispatch(createPost({
          title: values.title.trim(), body: values.body.trim(), author: user ? "@" + user.username : "Guest"
        })).unwrap();
        toast("Hot take posted");
        form.reset();
        if (search) setSearch("");
      } catch (message) {
        toast(typeof message === "string" ? message : "Couldn't post that", "error");
      }
    }
  });

  const showMine = page === 1 && !query;
  const posts = (showMine ? wall.mine : []).concat(wall.items);
  const totalPages = Math.max(1, Math.ceil(wall.total / WALL_PAGE_SIZE));

  function goToPage(p) { setPaging({ query, page: p }); window.scrollTo({ top: 0, behavior: "smooth" }); }
  const retry = () => dispatch(fetchWall({ page, query, force: true }));

  let list;
  if (wall.status === "loading" || wall.status === "idle") list = <Skeletons count={4} height={180} />;
  else if (wall.status === "failed") list = <ErrorState message={wall.error} onRetry={retry} />;
  else if (posts.length === 0) list = <EmptyState title="Nothing here yet">{query ? "No posts match that search." : "Be the first to post."}</EmptyState>;
  else list = posts.map(post => (
    <PostCard key={post.id} post={post} busy={wall.busyIds.includes(post.id)} onEdit={setEditing} />
  ));

  return (
    <Section title="The Wall" subtitle="Hot takes from around campus. Post, edit, delete, repeat.">
      <div className="two-col">
        <div className="form-card sticky">
          <h3 style={{ fontSize: 20, marginBottom: 14 }}>Drop a hot take</h3>
          <form onSubmit={form.handleSubmit} noValidate>
            <TextInput form={form} name="title" label="Headline" required maxLength={80} counter
                       placeholder="The library is the new club" />
            <TextArea form={form} name="body" label="Your take" required maxLength={280}
                      placeholder="Hear me out..." />
            <button type="submit" className="btn" style={{ width: "100%" }} disabled={wall.creating}>
              {wall.creating ? <><span className="spinner" /> Posting</> : "Post it"}
            </button>
          </form>
          <p className="field-hint" style={{ marginTop: 12 }}>
            Posting as {user ? "@" + user.username : "Guest"}. {!user && <Link to="join" style={{ textDecoration: "underline" }}>Join</Link>}
          </p>
        </div>

        <div>
          <div className="filters">
            <SearchBox value={search} onChange={setSearch} placeholder="Search the wall..." pending={search.trim() !== query} />
            <button className="btn-outline" onClick={retry} aria-label="Refresh"><Icon name="refresh" size={16} /></button>
          </div>
          {wall.status === "succeeded" && (
            <p className="result-meta">
              Page {page} of {totalPages} · {wall.total} posts{query ? ' matching "' + query + '"' : ""}
            </p>
          )}
          <div className="grid" style={{ gridTemplateColumns: "repeat(auto-fill, minmax(260px, 1fr))" }}>{list}</div>
          {wall.status === "succeeded" && <Pagination page={page} totalPages={totalPages} onChange={goToPage} />}
        </div>
      </div>
      <EditPostModal key={editing ? editing.id : "none"} post={editing} onClose={() => setEditing(null)} />
      <p className="credit">Posts from <a href="https://dummyjson.com" target="_blank" rel="noopener noreferrer">DummyJSON</a>, a practice REST API.</p>
    </Section>
  );
}

/* ---------- PROFILE (tabs: badges, bets, created, GitHub) ---------- */
const GH_USER_RE = /^[a-zA-Z0-9](?:[a-zA-Z0-9]|-(?=[a-zA-Z0-9])){0,38}$/;
function validateGithub(v) {
  const name = v.username.trim();
  if (!name) return { username: "Enter a GitHub username." };
  if (!GH_USER_RE.test(name)) return { username: "That isn't a valid GitHub username." };
  return {};
}

function GithubViewer() {
  const { user, linkGithub } = useAuth();
  const toast = useToast();
  const gh = useAsync();
  const messages = { 404: "No GitHub user goes by that name." };

  const form = useForm({
    initialValues: { username: (user && user.github) || "" },
    validate: validateGithub,
    onSubmit: async values => { await gh.run(() => fetchGithub(values.username.trim()), messages); }
  });

  // Load the linked account once when the tab opens.
  useEffect(() => {
    if (user && user.github) gh.run(() => fetchGithub(user.github), messages);

function ProfilePage() {
  const bets = useSelector(selectBets);
  const clout = useSelector(selectClout);
  const { user, logout } = useAuth();
  const toast = useToast();
  const [tab, setTab] = useState("badges");

  const myBets = bets.filter(b => b.myVote);
  const finished = myBets.filter(b => b.closed).sort((a, b) => b.closesAt - a.closesAt);
  const wins = finished.filter(b => b.payout > 0);
  const created = bets.filter(b => b.mine);

  // Current streak = wins in a row, counting back from the most recent result.
  let streak = 0;
  for (const bet of finished) { if (bet.payout > 0) streak++; else break; }

  function handleReset() {
    if (window.confirm("Reset all your votes, clout and badges? Your account stays.")) resetProgress();
  }
  function handleLogout() {
    logout();
    toast("Logged out", "info");
  }

  return (
    <Section title={user ? "Your profile" : "Guest profile"}>
      <div className="profile">
        <img src={avatarUrl(user ? user.avatar : "you")} alt="Your avatar" />
        <div className="who">
          <h3>{user ? user.fullName : "You"}</h3>
          <p>{user ? "@" + user.username + " · " + user.college + ", " + user.year : "Guest bettor, joined this semester"}</p>
          {user && user.interests.length > 0 && (
            <div className="tag-row" style={{ marginTop: 8 }}>{user.interests.map(i => <span className="tag" key={i}>{i}</span>)}</div>
          )}
        </div>
        <div className="numbers">
          <div><b>{myBets.length}</b><span>Bets placed</span></div>
          <div><b>{streak}</b><span>Streak</span></div>
          <div><b>{finished.length ? Math.round(wins.length / finished.length * 100) + "%" : "-"}</b><span>Accuracy</span></div>
          <div><b>{clout.toLocaleString()}</b><span>Clout</span></div>
        </div>
      </div>

      {!user && (
        <div className="card" style={{ marginBottom: 24, display: "flex", gap: 16, alignItems: "center", flexWrap: "wrap" }}>
          <p style={{ flex: 1 }}>Make it official: pick a username, get 100 bonus clout and a spot on the leaderboard.</p>
          <Link to="join" className="btn">Join Bolbet</Link>
        </div>
      )}

      <Tabs active={tab} onChange={setTab} tabs={[
        { id: "badges", label: "Badges" },
        { id: "bets", label: "My calls", count: myBets.length },
        { id: "created", label: "Bets I made", count: created.length },
        { id: "github", label: "GitHub" }
      ]} />

      {tab === "badges" && (
        <div className="badges">
          {BADGES.map(badge => {
            const unlocked = myBets.length >= badge.need;
            return (
              <div className={"badge" + (unlocked ? " unlocked" : "")} key={badge.title}>
                <Icon name={badge.icon} color="var(--lime)" />
                <div className="title">{badge.title}</div>
                <div className="need">{unlocked ? "Unlocked" : badge.need + " bets to unlock"}</div>
              </div>
            );
          })}
        </div>
      )}

      {tab === "bets" && (
        myBets.length === 0
          ? <EmptyState title="No calls yet"><Link to="bets" className="btn">Go vote on something</Link></EmptyState>
          : myBets.map(bet => {
              let text = "Open", cls = "";
              if (bet.closed) {
                if (bet.payout > 0) { text = "Won +" + bet.payout; cls = "win"; }
                else { text = "Lost " + Math.abs(bet.payout); cls = "loss"; }
              }
              return (
                <div className="my-bet" key={bet.id}>
                  <span className="q">{bet.question}</span>
                  <span className="pick">You: {bet.myVote === "A" ? bet.optionA : bet.optionB}</span>
                  <span className={"status " + cls}>{text}</span>
                </div>
              );
            })
      )}

      {tab === "created" && (
        created.length === 0
          ? <EmptyState title="You haven't posted a bet">Use the + New Bet button, or turn a TV show into one on Discover.</EmptyState>
          : <div className="grid">{created.map(bet => <BetCard key={bet.id} bet={bet} />)}</div>
      )}

      {tab === "github" && <GithubViewer />}

      <div style={{ display: "flex", gap: 20 }}>
        <button className="link-btn" onClick={handleReset}>Reset my progress</button>
        {user && <button className="link-btn" onClick={handleLogout}>Log out</button>}
      </div>
    </Section>
  );
}

/* ---------- JOIN (registration form with full validation) ---------- */
const JOIN_DEFAULTS = {
  fullName: "", username: "", email: "", phone: "", college: "", year: "",
  password: "", confirm: "", interests: [], avatar: AVATAR_SEEDS[0], terms: false
};
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

function passwordScore(password) {
  let score = 0;
  if (password.length >= 8) score++;
  if (/[a-z]/.test(password) && /[A-Z]/.test(password)) score++;
  if (/\d/.test(password)) score++;
  if (/[^A-Za-z0-9]/.test(password)) score++;
  return score;
}

function validateJoin(v) {
  const e = {};
  const name = v.fullName.trim();
  if (!name) e.fullName = "We need your name.";
  else if (name.length < 3) e.fullName = "At least 3 characters.";
  else if (!/^[A-Za-z][A-Za-z .'-]*$/.test(name)) e.fullName = "Letters and spaces only.";

  if (!v.username) e.username = "Pick a username.";
  else if (!/^[a-z0-9_]{3,15}$/.test(v.username)) e.username = "3–15 characters: lowercase letters, numbers or _.";

  if (!v.email.trim()) e.email = "Email is required.";
  else if (!EMAIL_RE.test(v.email.trim())) e.email = "That email doesn't look right.";

  if (v.phone.trim() && !/^[6-9]\d{9}$/.test(v.phone.trim())) e.phone = "Use a 10-digit Indian mobile number.";
  if (!v.college) e.college = "Choose your college.";
  if (!v.year) e.year = "Choose your year.";

  if (!v.password) e.password = "Create a password.";
  else if (v.password.length < 8) e.password = "At least 8 characters.";
  else if (passwordScore(v.password) < 3) e.password = "Add upper and lower case, a number or a symbol.";

  if (!v.confirm) e.confirm = "Type the password again.";
  else if (v.confirm !== v.password) e.confirm = "Passwords don't match.";

  if (v.interests.length < 2) e.interests = "Pick at least two vibes.";
  if (!v.terms) e.terms = "You need to accept the house rules.";
  return e;
}

function JoinPage() {
  const { user, register, logout } = useAuth();
  const dispatch = useDispatch();
  const toast = useToast();
  const { play } = useSettings();
  const [serverError, setServerError] = useState(null);

  const form = useForm({
    initialValues: JOIN_DEFAULTS,
    validate: validateJoin,
    onSubmit: async v => {
      if (usernameStatus === "taken") { toast("That username is taken", "error"); return; }
      if (usernameStatus === "checking") { toast("Still checking that username…", "info"); return; }
      setServerError(null);
      try {
        const [firstName, ...rest] = v.fullName.trim().split(/\s+/);
        // A real POST to a practice API. We never send the password to a fake server.
        const res = await withRetry(() => api.post(ENDPOINTS.users + "/add", {
          firstName, lastName: rest.join(" "), username: v.username, email: v.email.trim()
        }));
        register({
          id: res.data.id, fullName: v.fullName.trim(), username: v.username, email: v.email.trim(),
          phone: v.phone.trim(), college: v.college, year: v.year, interests: v.interests,
          avatar: v.avatar, github: "", joinedAt: Date.now()
        });
        dispatch(cloutChanged(100));
        dispatch(feedAdded("@" + v.username + " just joined", "+100 welcome clout"));
        toast("Welcome aboard, +100 clout");
        play(880);
        navigate("profile");
      } catch (err) {
        setServerError(errorMessage(err));
      }
    }
  });

  const formatError = form.errors.username;
  const usernameStatus = useUsernameCheck(form.values.username, !formatError);
  const usernameError = form.showError("username") || (usernameStatus === "taken" ? "Someone already has that one." : null);
  const usernameHint = {
    checking: "Checking if it's free…", available: "Nice, that one's free.",

  if (user) {

          <Link to="profile" className="btn">Go to profile</Link>
          <button className="btn-outline" onClick={() => { logout(); toast("Logged out", "info"); }}>Log out</button>
        </div>
      </Section>
    );
  }

  const v = form.values;
  return (
    <Section title="Join Bolbet" subtitle="Ten fields between you and 100 free clout.">
      <div className="two-col">
        {/* Live preview: shows the form values as you type */}
        <div className="form-card sticky" style={{ textAlign: "center" }}>
          <img src={avatarUrl(v.avatar)} alt="" style={{ width: 96, height: 96, borderRadius: "50%", border: "3px solid var(--lime)" }} />
          <h3 style={{ marginTop: 12 }}>{v.fullName.trim() || "Your name"}</h3>
          <p className="field-hint" style={{ fontFamily: "Space Mono" }}>@{v.username || "username"}</p>
          <p className="field-hint">{[v.college, v.year].filter(Boolean).join(", ") || "College, year"}</p>
          <div className="tag-row" style={{ justifyContent: "center", marginTop: 12 }}>
            {v.interests.map(i => <span className="tag" key={i}>{i}</span>)}
          </div>
          <div className="card" style={{ marginTop: 20, textAlign: "left" }}>
            <h4>What you get</h4>
            <p>+100 welcome clout, your name on the leaderboard, a profile with your GitHub, and posts under your own handle.</p>
          </div>
        </div>

        <form className="form-card" onSubmit={form.handleSubmit} noValidate>
          {serverError && <div className="server-error" role="alert">{serverError} Try again in a moment.</div>}

          <Field label="Pick an avatar">
            <div className="avatar-pick">
              {AVATAR_SEEDS.map(seed => (
                <button type="button" key={seed} className={v.avatar === seed ? "on" : ""} aria-label={"Avatar " + seed}
                        aria-pressed={v.avatar === seed} onClick={() => form.setFieldValue("avatar", seed)}>
                  <img src={avatarUrl(seed)} alt="" />
                </button>
              ))}
            </div>
          </Field>

          <div className="form-grid">
            <TextInput form={form} name="fullName" label="Full name" required autoComplete="name" placeholder="Rajesh Kumar" />
            <TextInput form={form} name="username" label="Username" required autoComplete="username" placeholder="chaos_king"
                       error={usernameError} hint={usernameHint} hintOk={usernameStatus === "available"}
                       onChange={e => form.setFieldValue("username", e.target.value.toLowerCase().replace(/\s/g, ""))} />
            <TextInput form={form} name="email" label="Email" type="email" required autoComplete="email" placeholder="you@college.edu" />
            <TextInput form={form} name="phone" label="Phone (optional)" type="tel" inputMode="numeric" maxLength={10}
                       autoComplete="tel-national" placeholder="9876543210" />
            <SelectInput form={form} name="college" label="College" required placeholder="Choose one" options={COLLEGES} />
            <SelectInput form={form} name="year" label="Year" required placeholder="Choose one" options={YEARS} />
            <PasswordInput form={form} name="password" label="Password" required showMeter autoComplete="new-password" />
            <PasswordInput form={form} name="confirm" label="Confirm password" required autoComplete="new-password" />
            <div className="span-2">
              <CheckboxGroup form={form} name="interests" label="Your vibes" required options={CATEGORIES.slice(1)} />
              <Checkbox form={form} name="terms" label="I promise this is just for fun and no real money is involved." />
            </div>
          </div>

          <button type="submit" className="btn" style={{ width: "100%", padding: 14 }} disabled={form.submitting}>
            {form.submitting ? <><span className="spinner" /> Creating your account</> : "Create account"}
          </button>
          {!form.isValid && Object.keys(form.errors).length > 0 && (
            <p className="field-hint" style={{ textAlign: "center", marginTop: 10 }}>
              {Object.keys(form.errors).length} field{Object.keys(form.errors).length === 1 ? "" : "s"} still need attention.
            </p>
          )}
        </form>
      </div>
    </Section>
  );
}

/* ---------- UNDER THE HOOD (state architecture explained, live) ---------- */
const HOOKS_USED = [
  ["useHashRoute", "Reads #/page?query from the URL and re-renders on hashchange."],
  ["useDebounce", "Waits until typing stops before searching (Bets, Discover, Wall, username check)."],
  ["useLocalStorage", "useState that survives a refresh (sound setting, logged-in user)."],
  ["useForm", "Values, touched fields, validation errors and submit for every form."],
  ["useUsernameCheck", "Async validation: asks the API if a username is free, cancels stale requests."],
  ["useAsync", "Loading / success / error / retry for one-off requests (GitHub viewer)."],
  ["useShowSearch", "Searches TVMaze, cancels the previous request with AbortController."],
  ["useShowBrowser", "useReducer-based paging through the TVMaze catalogue."],
  ["useInfiniteScroll", "IntersectionObserver on a sentinel div to load more on scroll."],
  ["useClickOutside", "Closes dropdowns when you click elsewhere."],
  ["useNow", "One shared clock for every countdown, via useSyncExternalStore."],
  ["useActionLog", "Subscribes to the Redux logger middleware (the Action log tab)."]
];

function LabPage() {
  const [tab, setTab] = useState("arch");
  const state = useSelector(s => s);
  const log = useActionLog();
  const { user } = useAuth();
  const { soundOn } = useSettings();

  const snapshot = {
    bets: {
      total: state.bets.items.length,
      open: state.bets.items.filter(b => !b.closed).length,
      votedByYou: state.bets.items.filter(b => b.myVote).length,
      createdByYou: state.bets.items.filter(b => b.mine).length
    },
    wallet: state.wallet,
    feed: { items: state.feed.items.length, latest: state.feed.items[0] && state.feed.items[0].text },
    wall: {
      status: state.wall.status, page: state.wall.page, query: state.wall.query, total: state.wall.total,
      loadedPosts: state.wall.items.length, yourPosts: state.wall.mine.length, busyIds: state.wall.busyIds
    }
  };

  const layers = [
    { title: "Redux Toolkit (global, shared, saved)", colour: "var(--lime)", icon: "layers",
      text: "bets, wallet, feed and wall slices. Many pages read and change them, so they live in one store. createAsyncThunk handles Wall CRUD; extraReducers let the wallet react to votes." },
    { title: "Context API (app-wide services)", colour: "var(--cyan)", icon: "share",
      text: "AuthContext (who is logged in), ToastContext (popups), SettingsContext (sound) and ComposerContext (open the new-bet modal from anywhere). Rarely changes, needed everywhere." },
    { title: "Local useState (one component)", colour: "var(--pink)", icon: "aim",
      text: "Search text, open tab, open dropdown, modal open/closed, show-password toggle. Nobody else needs it, so it stays local." },
    { title: "Server cache (useReducer + hooks)", colour: "var(--orange)", icon: "tv",
      text: "Discover's TV data is fetched data owned by TVMaze. It lives in custom hooks on that page and is thrown away when you leave." }
  ];

  return (
    <Section title="Under the hood" subtitle="How state is organised in this app, with live data.">
      <Tabs active={tab} onChange={setTab} tabs={[
        { id: "arch", label: "Architecture" }, { id: "store", label: "Live store" },
        { id: "log", label: "Action log", count: log.length }, { id: "hooks", label: "Hooks" }
      ]} />

      {tab === "arch" && (
        <>
          <div className="grid">
            {layers.map(l => (
              <div className="card" key={l.title}>
                <Icon name={l.icon} color={l.colour} />
                <h4>{l.title}</h4><p>{l.text}</p>
              </div>
            ))}
          </div>
          <div className="card" style={{ marginTop: 18 }}>
            <h4>Rule of thumb</h4>
            <p>Start with local state. Lift it to Context when many components need it but it rarely changes.
               Move it to Redux when it changes often, many screens edit it, or you want to persist and debug it.</p>
          </div>
        </>
      )}

      {tab === "store" && (
        <div className="grid">
          <div><h4 style={{ marginBottom: 10 }}>Redux store</h4><pre className="code">{JSON.stringify(snapshot, null, 2)}</pre></div>
          <div><h4 style={{ marginBottom: 10 }}>Context values</h4>
            <pre className="code">{JSON.stringify({ auth: user ? { username: user.username, college: user.college, github: user.github || null } : null, settings: { soundOn } }, null, 2)}</pre>
          </div>
        </div>
      )}

      {tab === "log" && (
        <div className="list-box">
          {log.length === 0
            ? <p style={{ padding: 16, color: "var(--text-dim)" }}>No actions yet. Vote on a bet or open the Wall, then come back.</p>
            : log.map(entry => (
                <div className="log-row" key={entry.id}><span className="t">{entry.time}</span><span className="type">{entry.type}</span></div>
              ))}
        </div>
      )}

      {tab === "hooks" && (
        <div className="list-box">
          <table className="hook-table"><tbody>
            {HOOKS_USED.map(([name, text]) => <tr key={name}><td>{name}</td><td>{text}</td></tr>)}
          </tbody></table>
        </div>
      )}
    </Section>
  );
}

}

const ROUTES = {
  home: HomePage, bets: BetsPage, discover: DiscoverPage, wall: WallPage,
  leaderboard: LeaderboardPage, profile: ProfilePage, join: JoinPage, how: HowPage, lab: LabPage
};

function App() {
  const { path, query } = useHashRoute();
  const dispatch = useDispatch();
  const toast = useToast();
  const { play } = useSettings();

  // Once a second, close any bets whose timer has run out and pay out clout.
  useEffect(() => {
    function tick() {
      const payouts = dispatch(resolveExpiredBets());
      payouts.forEach(amount => {
        if (amount > 0) { toast("You called it! +" + amount + " clout"); play(880); }
        else { toast("Wrong call. " + amount + " clout", "error"); play(300); }
      });
    }
    tick();
    const timer = setInterval(tick, 1000);
    return () => clearInterval(timer);
  }, [dispatch, toast, play]);

  const Page = ROUTES[path] || NotFoundPage;
  return (
    <>
      <Navbar path={path} />
      <main>
        <ErrorBoundary key={path}>
          <Page query={query} />
        </ErrorBoundary>
      </main>
      <Footer />
    </>
  );
}


/* =========================================================
   14. START-UP
   Providers wrap the app so every component can reach them:
   Redux store > sound > toasts > logged-in user > bet composer > App
   ========================================================= */
ReactDOM.createRoot(document.getElementById("root")).render(
  <Provider store={store}>
    <SettingsProvider>
      <ToastProvider>
        <AuthProvider>
          <ComposerProvider>
            <App />
          </ComposerProvider>
        </AuthProvider>
      </ToastProvider>
    </SettingsProvider>
  </Provider>
);
</script>
</body>
</html>
